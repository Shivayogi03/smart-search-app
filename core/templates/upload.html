<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Document - KnowSearch</title>
    <style>
        body {
            background: linear-gradient(to right, #11998e, #38ef7d);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        input[type="file"] {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
        }

        input[type="file"]::file-selector-button {
            background: #fff;
            color: #11998e;
            border: none;
            padding: 8px 15px;
            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            background: #f1f1f1;
        }

        button {
            padding: 12px 25px;
            font-size: 1.1rem;
            color: #11998e;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #fff;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #f1f1f1;
            transform: translateY(-2px);
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        a:hover {
            color: #ffe600;
        }

        @media(max-width: 600px) {
            h2 {
                font-size: 2rem;
            }

            form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <h2>Upload Document</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file" required>
        <br>
        <button type="submit">Upload & Index</button>
    </form>

    <a href="/search">Go to Search</a>

</body>
</html>
